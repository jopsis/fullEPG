name: Construir y publicar la guía

on:
  schedule:
    # Dos veces al día, y a una hora en punto rara a propósito.
    #
    # El planificador de GitHub no garantiza la hora: las tareas se encolan y,
    # cuando hay cola, se retrasan o se descartan. Los minutos «:00» son los
    # más disputados con diferencia, así que se evita. Y con dos pasadas, que
    # una se pierda no deja la guía un día entero sin actualizar.
    - cron: "23 4 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build.yml"

permissions:
  # `write` porque cada pasada anota su resultado en `estado.json`, en la raíz.
  contents: write
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela la que esté en curso para no
# dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar la guía
        id: generar
        run: python3 tools/build_epg.py --out public

      - name: Resumen
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          s = json.loads(pathlib.Path("public/estado.json").read_text())
          print("| Dato | Valor |")
          print("| --- | --- |")
          for k, v in s.items():
              if k.startswith("bytes_"):
                  v = f"{v/1024/1024:.1f} MB"
              print(f"| {k} | {v} |")
          PY

      # Se anota pase lo que pase: saber que falló importa tanto como saber que
      # fue bien, y el commit mantiene vivo el repositorio para que GitHub no
      # apague el cron a los 60 días sin actividad.
      - name: Anotar el estado
        if: always()
        run: |
          python3 tools/write_status.py \
            --result "${{ steps.generar.outcome }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "estado: ${{ steps.generar.outcome }}" -m "$(date -u +%Y-%m-%dT%H:%MZ)"
          # Explícito y no por seguimiento: el checkout de una acción no
          # siempre deja la rama configurada. Y con rebase por si otra pasada
          # escribió mientras tanto.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
